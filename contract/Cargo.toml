[package]
name = "perp-agent-nft"
version = "0.1.0"
edition = "2021"
authors = ["Didi / Jadenprosper"]
license = "MIT"
description = "NEP-171 NFT that IS a Hyperliquid perp trading agent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.14.0", features = ["unit-testing", "legacy"] }
near-contract-standards = "5.14.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
